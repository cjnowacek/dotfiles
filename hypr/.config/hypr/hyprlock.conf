# Flexoki, tuned as in Cairn and waybar: paper text, blue ring, red on a wrong password.
general {
    hide_cursor = true
    grace = 5
}

background {
    monitor =
    path = ~/.config/hypr/assets/lockscreen.png
    blur_passes = 0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(102, 160, 200, 0.6)
    inner_color = rgba(40, 39, 38, 1.0)
    font_color = rgba(206, 205, 195, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    fail_color = rgba(232, 112, 95, 1.0)
    fail_text = <i>$FAIL</i>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(206, 205, 195, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(159, 157, 150, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
