general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend after 10 minutes.
# NOTE: do NOT use `dpms off` here. On this NVIDIA + DisplayPort setup the
# DP monitor reports a hard connector disconnect on dpms-off, which sends
# Hyprland into enterUnsafeState() and segfaults the whole session.
# Suspending brings the GPU down cleanly via nvidia-suspend.service instead.
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
