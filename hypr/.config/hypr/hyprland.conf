# Shared Hyprland config for all machines. Anything hardware-specific
# (monitors, GPU env, wallpaper daemon, laptop keys) lives in
# hosts/<role>/host.conf; bootstrap.sh links the right one to
# ~/.config/hypr/host.conf, which is sourced at the end of this file.


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Wayland / toolkit hints
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
# Wallpaper daemon comes from host.conf (hyprpaper on laptop, cycler on desktop)
exec-once = dunst
exec-once = hypridle
exec-once = hyprsunset
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


###################
### PERMISSIONS ###
###################

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(11111bee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        vibrancy = 0.2
    }
}

animations {
    enabled = true

    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, snappy, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 4, snappy, slide
    animation = border, 1, 10, default
    # No `loop` here on purpose. A looping borderangle re-renders the gradient
    # forever, which pins the compositor at full frame rate on both 4K outputs
    # and defeats `debug:vfr` below — it can never go idle. Without loop the
    # gradient still sweeps on focus change, then settles.
    animation = borderangle, 1, 30, smoothIn
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

debug {
    vfr = true
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = float-dialogs
    match:title = ^(Open|Save|File|Folder|Choose|Select).*$
    float = true
    center = true
}

windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = true
    size = 800 500
    center = true
}

windowrule {
    name = float-portal-gtk
    match:class = ^(xdg-desktop-portal-gtk)$
    float = true
    size = 900 600
    center = true
}

# Cairn (the zk-engine app) is relaunched constantly while developing it, and
# every launch was landing on whatever workspace was in front. Pin it to 4 —
# a HDMI-A-1 workspace — so a rebuild never covers the work that prompted it.
# float = false is the tile rule in block form; dwindle is the global layout
# anyway, so this only matters if a future rule tries to float it.
windowrule {
    name = cairn-workspace-4
    # Native Wayland reports `cairn`; under XWayland (QT_QPA_PLATFORM=xcb,
    # which is how it gets driven by xdotool) the same app reports `Cairn`.
    match:class = ^([Cc]airn)$
    workspace = 4
    float = false
}


####################
### HOST OVERLAY ###
####################

# Symlink created by bootstrap.sh -> hosts/<desktop|laptop>/host.conf
source = ~/.config/hypr/host.conf
