# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select clipboard
mouse_hide_wait 3.0

# Window
window_padding_width 8
confirm_os_window_close 0
background_opacity 1.0
dynamic_background_opacity yes

# Tab bar
tab_bar_style powerline
tab_bar_min_tabs 2
tab_powerline_style slanted

# Flexoki Dark: kepano/flexoki kitty/flexoki_dark.conf (MIT), the same inks as
# Cairn, waybar, wofi, dunst and hyprlock. Marks and the URL colour follow it.
foreground              #CECDC3
background              #100F0F
selection_foreground    #CECDC3
selection_background    #403E3C
cursor                  #CECDC3
cursor_text_color       #100F0F
url_color               #66A0C8

active_border_color     #66A0C8
inactive_border_color   #403E3C
active_tab_foreground   #CECDC3
active_tab_background   #403E3C
inactive_tab_foreground #878580
inactive_tab_background #282726

# Black
color0  #100F0F
color8  #6F6E69

# Red
color1  #AF3029
color9  #D14D41

# Green
color2  #66800B
color10 #879A39

# Yellow
color3  #AD8301
color11 #D0A215

# Blue
color4  #205EA6
color12 #4385BE

# Magenta
color5  #A02F6F
color13 #CE5D97

# Cyan
color6  #24837B
color14 #3AA99F

# White
color7  #878580
color15 #CECDC3

# Marks
mark1_foreground #100F0F
mark1_background #66A0C8
mark2_foreground #100F0F
mark2_background #E47DA8
mark3_foreground #100F0F
mark3_background #5ABDAC

# Wayland
wayland_titlebar_color system
linux_display_server wayland
