# Desktop (dual Dell S2725QS on NVIDIA) — sourced at the end of hyprland.conf.

################
### MONITORS ###
################

# Both panels are Dell S2725QS — 4K 120Hz hardware, but both run at 60 here.
#
# HDMI-A-1: EDID DOES advertise 3840x2160@120 (aquamarine logs it as "Mode 1"),
#   but requesting it — via config or `hyprctl keyword monitor` — is silently
#   ignored: Hyprland logs no modeset attempt at all and stays at 60. Tried
#   @120, @120.00 and @119.88. Suspect the nvidia DRM atomic path won't do
#   HDMI 2.1 FRL+DSC, which 4K120 needs for bandwidth. Recheck after driver
#   bumps (currently 610.43.03).
# DP-1: only advertises 4K@60 at all — its 120Hz modes top out at 2560x1440,
#   so the DP link isn't negotiating DSC. Most likely a pre-DP1.4 cable.
#
# Do NOT use `highrr` on either: it would drop them to 1440p to chase refresh.
monitor = DP-1, 3840x2160@60, 0x0, 1.5
monitor = HDMI-A-1, 3840x2160@60, 2560x0, 1.5

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1


##############
### NVIDIA ###
##############

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

cursor {
    no_hardware_cursors = true
}


#############
### INPUT ###
#############

# Flat acceleration for the desktop mouse; a touchpad wants accel, so this
# stays out of the shared config.
input {
    accel_profile = flat
}


#################
### WALLPAPER ###
#################

# hyprpaper here is a stub (ipc off); wallpapers come from the swww/awww cycler.
exec-once = ~/.config/hypr/scripts/hypr-start.sh ~/.config/hypr/scripts/wallpaper-cycle.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-cycle.sh once   # next wallpaper now
