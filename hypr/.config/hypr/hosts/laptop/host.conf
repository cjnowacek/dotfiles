# Laptop (ThinkPad T480, Intel graphics, eDP-1 1080p) — sourced at the end of
# hyprland.conf.

################
### MONITORS ###
################

monitor = eDP-1, preferred, auto, 1
# Anything hotplugged (dock, HDMI) just extends to the right at native res.
monitor = , preferred, auto, 1


#################
### WALLPAPER ###
#################

exec-once = hyprpaper


######################
### LAPTOP HARDWARE ###
######################

bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-


# VFR — 0.52 syntax; on the desktop's newer Hyprland this is debug:vfr
misc {
    vfr = true
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Same rules as hosts/desktop/host.conf, in the pre-0.53 windowrulev2 dialect.
# Fold into the shared config once this machine's Hyprland is updated.

windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = float, title:^(Open|Save|File|Folder|Choose|Select).*$
windowrulev2 = center, title:^(Open|Save|File|Folder|Choose|Select).*$

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 800 500, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 900 600, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$

windowrulev2 = workspace 4, class:^([Cc]airn)$
windowrulev2 = tile, class:^([Cc]airn)$
